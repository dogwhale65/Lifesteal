# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Compiled against the OLDEST supported 26.1.x so that nothing newer than 26.1
# can be referenced by accident. The mod is declared compatible with the whole
# ~26.1 line (26.1, 26.1.1, 26.1.2) in fabric.mod.json.
minecraft_version=26.1
# 0.18.6 is the lowest loader whose Knot mixin service accepts compatibilityLevel
# JAVA_25; 0.18.4/0.18.5 boot but log an "instability may occur" warning.
loader_version=0.18.6
loom_version=1.15.5

# Mod Properties
mod_version=26.1+r1
maven_group=nightfallmods.lifesteal

# Dependencies
# Newest Fabric API built against plain 26.1; later builds retarget to 26.1.1/26.1.2.
fabric_api_version=0.145.1+26.1
